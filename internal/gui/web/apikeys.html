<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VixImage · API 密钥</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0a0e1a; color:#e8eefc; font-family: system-ui,"Segoe UI",sans-serif; }
  .top { display:flex; align-items:center; padding:14px 22px; background:#101a30; border-bottom:1px solid #243a63; }
  .logo { font-weight:700; font-size:18px; letter-spacing:1px; }
  .logo span { color:#7c3aed; }
  .nav { margin-left:30px; display:flex; gap:6px; }
  .nav a { color:#9ec5ff; text-decoration:none; padding:8px 14px; border-radius:8px; font-size:14px; }
  .nav a:hover, .nav a.on { background:#1b2b4a; color:#fff; }
  .right { margin-left:auto; font-size:13px; color:#7d93bd; }
  .right button { background:#22324f; border:0; color:#cfe0ff; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .wrap { padding:26px; max-width:980px; margin:0 auto; }
  .box { background:#101a30; border:1px solid #243a63; border-radius:14px; padding:20px; margin-bottom:18px; }
  h3 { margin:0 0 14px; font-size:15px; color:#9ec5ff; }
  label { display:block; font-size:12px; color:#8fb2e6; margin:10px 0 5px; }
  input,select { width:100%; padding:9px 11px; border-radius:8px; border:1px solid #2c4470; background:#0c1426; color:#e8eefc; font-size:13px; box-sizing:border-box; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .note { color:#7d93bd; font-size:12px; margin-top:8px; }
  button.act { margin-top:14px; padding:10px 20px; border:0; border-radius:9px; cursor:pointer; background:linear-gradient(90deg,#3b82f6,#7c3aed); color:#fff; font-weight:600; }
  .err { color:#ff7b7b; font-size:12px; margin-top:8px; min-height:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid #1c2c4a; }
  th { color:#8fb2e6; font-weight:600; font-size:12px; }
  td .k { font-family:ui-monospace,Menlo,Consolas,monospace; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px; }
  .on { background:#10351f; color:#5ee08a; }
  .off { background:#3a1620; color:#ff8e8e; }
  .btn-del { background:#3a1620; color:#ff9b9b; border:1px solid #5a2030; padding:5px 12px; border-radius:7px; cursor:pointer; font-size:12px; }
  .btn-copy { background:#1b2b4a; color:#9ec5ff; border:0; padding:5px 10px; border-radius:7px; cursor:pointer; font-size:12px; margin-left:8px; }
  .empty { color:#6b80a8; padding:18px; text-align:center; }
  code { background:#0c1426; padding:2px 6px; border-radius:5px; color:#9ec5ff; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">Vix<span>Image</span></div>
    <div class="nav">
      <a href="/">概览</a>
      <a href="/mymodels">我的模型</a>
      <a href="/upstream">上游模型</a>
      <a href="/playground">Playground</a>
      <a href="/apikeys" class="on">API 密钥</a>
      <a href="/config">系统配置</a>
    </div>
    <div class="right"><button onclick="logout()">退出</button></div>
  </div>
  <div class="wrap">
    <div class="box">
      <h3>新建密钥</h3>
      <div class="row2">
        <div><label>备注 / 标签（可选）</label><input id="name" placeholder="例如：移动端、第三方服务"></div>
        <div><label>自定义密钥（留空则自动生成）</label><input id="key" placeholder="vix-sk-..."></div>
      </div>
      <button class="act" onclick="create()">创建密钥</button>
      <div class="err" id="err"></div>
    </div>

    <div class="box">
      <h3>密钥列表（含调用次数）</h3>
      <div id="list">
        <table>
          <thead><tr><th>密钥（掩码）</th><th>备注</th><th>调用次数</th><th>最近调用</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none">还没有任何密钥，先在上面创建一个。</div>
      </div>
      <div class="note">密钥不预置默认项；每个密钥独立统计调用次数。完整密钥仅在创建时于下方提示中显示一次，请妥善保存。</div>
    </div>
  </div>
<script src="/session.js"></script>
<script>
async function load(){
  const j=await (await fetch('/api/apikeys')).json();
  const rows=document.getElementById('rows');
  rows.innerHTML='';
  const keys=j.keys||[];
  document.getElementById('empty').style.display = keys.length? 'none':'block';
  for(const k of keys){
    const tr=document.createElement('tr');
    const last=k.last_used_at? k.last_used_at.replace('T',' ').slice(0,19) : '—';
    tr.innerHTML=`<td><span class="k">${esc(k.key_mask)}</span></td>`+
      `<td>${esc(k.name||'—')}</td>`+
      `<td>${k.calls}</td>`+
      `<td>${last}</td>`+
      `<td><span class="pill ${k.enabled?'on':'off'}">${k.enabled?'启用':'禁用'}</span></td>`+
      `<td><button class="btn-del" onclick="del(${k.id})">删除</button></td>`;
    rows.appendChild(tr);
  }
}
async function create(){
  const err=document.getElementById('err');
  const body={ name:document.getElementById('name').value.trim(), key:document.getElementById('key').value.trim() };
  const r=await fetch('/api/apikeys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok){ err.style.color='#ff7b7b'; err.textContent=j.error||'创建失败'; return; }
  err.style.color='#5ee08a'; err.textContent='已创建，完整密钥（仅此一次）：'+j.key;
  document.getElementById('name').value=''; document.getElementById('key').value='';
  await load();
}
async function del(id){
  if(!confirm('确定删除该密钥？删除后使用它的调用将立即失效。')) return;
  const r=await fetch('/api/apikeys/'+id,{method:'DELETE'});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok){ alert(j.error||'删除失败'); return; }
  await load();
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function logout(){ try{ localStorage.removeItem('vix_sid'); }catch(e){} await fetch('/api/logout',{method:'POST'}); location.href='/login'; }
load();
</script>
</body>
</html>
