<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VixImage · 系统配置</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0a0e1a; color:#e8eefc; font-family: system-ui,"Segoe UI",sans-serif; }
  .top { display:flex; align-items:center; padding:14px 22px; background:#101a30; border-bottom:1px solid #243a63; }
  .logo { font-weight:700; font-size:18px; letter-spacing:1px; }
  .logo span { color:#7c3aed; }
  .nav { margin-left:30px; display:flex; gap:6px; }
  .nav a { color:#9ec5ff; text-decoration:none; padding:8px 14px; border-radius:8px; font-size:14px; }
  .nav a:hover, .nav a.on { background:#1b2b4a; color:#fff; }
  .right { margin-left:auto; font-size:13px; color:#7d93bd; }
  .right button { background:#22324f; border:0; color:#cfe0ff; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .wrap { padding:26px; max-width:820px; margin:0 auto; }
  .box { background:#101a30; border:1px solid #243a63; border-radius:14px; padding:20px; margin-bottom:18px; }
  h3 { margin:0 0 14px; font-size:15px; color:#9ec5ff; }
  label { display:block; font-size:12px; color:#8fb2e6; margin:10px 0 5px; }
  input,select { width:100%; padding:9px 11px; border-radius:8px; border:1px solid #2c4470; background:#0c1426; color:#e8eefc; font-size:13px; box-sizing:border-box; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label.chk { display:inline-block; font-size:13px; color:#cdd9f0; margin-top:12px;
             line-height:1.6; white-space:normal; }
  label.chk input { width:auto; margin-right:8px; vertical-align:middle; }
  label.chk span { display:inline; }
  button.save { margin-top:16px; padding:11px 22px; border:0; border-radius:9px; cursor:pointer; background:linear-gradient(90deg,#3b82f6,#7c3aed); color:#fff; font-weight:600; }
  .err { color:#ff7b7b; font-size:12px; margin-top:8px; min-height:14px; }
  .note { color:#7d93bd; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">Vix<span>Image</span></div>
    <div class="nav">
      <a href="/">概览</a>
      <a href="/mymodels">我的模型</a>
      <a href="/upstream">上游模型</a>
      <a href="/playground">Playground</a>
      <a href="/config" class="on">系统配置</a>
    </div>
    <div class="right"><button onclick="logout()">退出</button></div>
  </div>
  <div class="wrap">
    <div class="box">
      <h3>端口与运行</h3>
      <div class="row2">
        <div><label>GUI 端口</label><input id="gui_port" type="number"></div>
        <div><label>API 端口</label><input id="api_port" type="number"></div>
      </div>
      <label>图片编辑引擎</label>
      <select id="image_engine">
        <option value="go">Go 原生渲染（推荐，无需 Python）</option>
        <option value="python">Python PIL（兼容旧版）</option>
      </select>
      <label>Python 解释器（仅 python 引擎需要）</label><input id="python_bin">
      <label>数据目录</label><input id="data_dir" disabled>
      <label class="chk"><input type="checkbox" id="delete_outputs"><span><b>生产完成并提取后删除产物成品</b> —— Agent 工作区中间产物无论如何都会 100% 删除；勾选后连提取出的成品也会在落盘记录后删除（仅日志留档，文件链接将失效）</span></label>
    </div>
    <div class="box">
      <h3>存储模式（双存储：SQLite / MySQL）</h3>
      <div class="row2">
        <div><label>模式</label>
          <select id="storage_mode"><option value="sqlite">SQLite（默认零配置）</option><option value="mysql">MySQL</option></select>
        </div>
        <div><label>SQLite 路径</label><input id="sqlite_path"></div>
      </div>
      <label>MySQL DSN</label><input id="mysql_dsn">
      <div class="note">切换存储模式后需重启生效。</div>
    </div>
    <div class="box">
      <h3>缓存模式（双缓存：File / Redis）</h3>
      <label>模式</label>
      <select id="cache_mode"><option value="file">File（默认零配置）</option><option value="redis">Redis</option></select>
      <div class="row2">
        <div><label>Redis 地址</label><input id="redis_addr"></div>
        <div><label>Redis DB</label><input id="redis_db" type="number"></div>
      </div>
      <label>Redis 密码</label><input id="redis_pass" type="password">
      <div class="note">切换缓存模式后需重启生效。</div>
    </div>
    <div class="box">
      <h3>API Keys（API 鉴权）</h3>
      <label>每行一个</label><textarea id="api_keys" rows="3"></textarea>
    </div>
    <div class="box">
      <h3>GUI 账号密码（也可在 CLI 修改）</h3>
      <div class="row2">
        <div><label>账号</label><input id="gui_user"></div>
        <div><label>新密码（留空不修改）</label><input id="new_password" type="password"></div>
      </div>
      <label>原密码（修改密码时必填）</label><input id="old_password" type="password">
      <div class="note">账号与新密码随下方「保存配置」一起提交。</div>
    </div>
    <button class="save" onclick="save()">保存配置</button>
    <div class="err" id="err"></div>
  </div>
<script src="/session.js"></script>
<script>
async function load(){
  const j=await (await fetch('/api/config')).json();
  gui_port.value=j.gui_port; api_port.value=j.api_port; python_bin.value=j.python_bin; data_dir.value=j.data_dir;
  image_engine.value=j.image_engine||'go';
  storage_mode.value=j.storage_mode; sqlite_path.value=j.sqlite_path; mysql_dsn.value=j.mysql_dsn;
  cache_mode.value=j.cache_mode; redis_addr.value=j.redis_addr; redis_db.value=j.redis_db; redis_pass.value=j.redis_pass;
  api_keys.value=(j.api_keys||[]).join('\n');
  gui_user.value=j.gui_user||'';
  document.getElementById('delete_outputs').checked=!!j.delete_outputs;
}
async function save(){
  const body={
    gui_port:parseInt(gui_port.value), api_port:parseInt(api_port.value), python_bin:python_bin.value,
    image_engine:image_engine.value,
    storage_mode:storage_mode.value, mysql_dsn:mysql_dsn.value,
    cache_mode:cache_mode.value, redis_addr:redis_addr.value, redis_db:parseInt(redis_db.value||'0'), redis_pass:redis_pass.value,
    api_keys:api_keys.value.split('\n').map(s=>s.trim()).filter(Boolean),
    delete_outputs:document.getElementById('delete_outputs').checked
  };
  const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok){ err_.style.color='#ff7b7b'; err_.textContent=j.error||'保存失败'; return; }
  err_.style.color='#5ee08a'; err_.textContent=j.note||'已保存';
  // 账号与密码一并提交（密码留空则不修改）。
  const u=gui_user.value.trim();
  if(u||new_password.value){
    const ur=await fetch('/api/user',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u||undefined,new_password:new_password.value||undefined,old_password:old_password.value||undefined})});
    const uj=await ur.json().catch(()=>({}));
    if(!ur.ok||!uj.ok){ err_.style.color='#ff7b7b'; err_.textContent=uj.error||'配置已保存，但账号/密码修改失败'; return; }
    if(u) gui_user.value=uj.username||u;
    new_password.value=''; old_password.value='';
    err_.style.color='#5ee08a'; err_.textContent=(j.note||'已保存')+'，账号已更新为：'+(uj.username||u);
  }
}
const gui_port=document.getElementById('gui_port'); const api_port=document.getElementById('api_port');
const python_bin=document.getElementById('python_bin'); const data_dir=document.getElementById('data_dir');
const image_engine=document.getElementById('image_engine');
const storage_mode=document.getElementById('storage_mode'); const sqlite_path=document.getElementById('sqlite_path');
const mysql_dsn=document.getElementById('mysql_dsn'); const cache_mode=document.getElementById('cache_mode');
const redis_addr=document.getElementById('redis_addr'); const redis_db=document.getElementById('redis_db');
const redis_pass=document.getElementById('redis_pass'); const api_keys=document.getElementById('api_keys');
const gui_user=document.getElementById('gui_user'); const new_password=document.getElementById('new_password');
const old_password=document.getElementById('old_password');
const err_=document.getElementById('err');
async function logout(){ try{ localStorage.removeItem('vix_sid'); }catch(e){} await fetch('/api/logout',{method:'POST'}); location.href='/login'; }
load();
</script>
</body>
</html>
