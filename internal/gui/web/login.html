<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VixImage · 登录</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 30% 20%, #16243f, #0a0e1a); font-family: system-ui,"Segoe UI",sans-serif; color:#e8eefc; }
  .card { background:#101a30; border:1px solid #243a63; border-radius:16px; padding:36px 40px; width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.5); }
  h1 { margin:0 0 6px; font-size:24px; letter-spacing:1px; }
  .sub { color:#7d93bd; font-size:13px; margin-bottom:24px; }
  label { display:block; font-size:13px; color:#9ec5ff; margin:14px 0 6px; }
  input { width:100%; padding:11px 13px; border-radius:9px; border:1px solid #2c4470; background:#0c1426; color:#e8eefc; font-size:14px; }
  button { margin-top:22px; width:100%; padding:12px; border:0; border-radius:9px; cursor:pointer;
    background:linear-gradient(90deg,#3b82f6,#7c3aed); color:#fff; font-size:15px; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  .err { color:#ff6b6b; font-size:13px; margin-top:12px; min-height:16px; }
  .foot { margin-top:18px; font-size:12px; color:#5e76a3; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h1>VixImage</h1>
    <div class="sub">图像 Agent 控制台 · 请登录</div>
    {{if .Err}}<div class="err" style="margin-top:0;margin-bottom:6px">{{.Err}}</div>{{end}}
    <!-- 原生表单提交，不依赖 JavaScript：老旧浏览器同样可以登录 -->
    <form method="post" action="/login">
      <label>账号</label>
      <input id="u" name="username" placeholder="admin" autocomplete="username">
      <label>密码</label>
      <input id="p" name="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="submit">登 录</button>
    </form>
    <div class="foot">默认账号 admin / admin123（可在控制台或 CLI 修改）</div>
  </div>
</body>
</html>
