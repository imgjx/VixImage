<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VixImage · Playground</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0a0e1a; color:#e8eefc; font-family: system-ui,"Segoe UI",sans-serif; }
  .top { display:flex; align-items:center; padding:14px 22px; background:#101a30; border-bottom:1px solid #243a63; }
  .logo { font-weight:700; font-size:18px; letter-spacing:1px; }
  .logo span { color:#7c3aed; }
  .nav { margin-left:30px; display:flex; gap:6px; }
  .nav a { color:#9ec5ff; text-decoration:none; padding:8px 14px; border-radius:8px; font-size:14px; }
  .nav a:hover, .nav a.on { background:#1b2b4a; color:#fff; }
  .right { margin-left:auto; font-size:13px; color:#7d93bd; }
  .right button { background:#22324f; border:0; color:#cfe0ff; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .wrap { padding:26px; max-width:1200px; margin:0 auto; display:grid; grid-template-columns:420px 1fr; gap:20px; }
  .box { background:#101a30; border:1px solid #243a63; border-radius:14px; padding:18px; }
  h3 { margin:0 0 14px; font-size:15px; color:#9ec5ff; }
  label { display:block; font-size:12px; color:#8fb2e6; margin:10px 0 5px; }
  input,select,textarea { width:100%; padding:9px 11px; border-radius:8px; border:1px solid #2c4470; background:#0c1426; color:#e8eefc; font-size:13px; box-sizing:border-box; }
  textarea { resize:vertical; }
  button.go { margin-top:16px; width:100%; padding:12px; border:0; border-radius:9px; cursor:pointer; background:linear-gradient(90deg,#3b82f6,#7c3aed); color:#fff; font-weight:600; font-size:14px; }
  button.go:disabled { opacity:.55; cursor:wait; }
  .err { color:#ff7b7b; font-size:12px; margin-top:8px; min-height:14px; }
  .hint { font-size:11px; color:#6f86b0; margin-top:4px; line-height:1.5; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .gallery img { width:100%; border-radius:10px; border:1px solid #243a63; display:block; }
  .gallery a { color:#9ec5ff; font-size:12px; word-break:break-all; }
  .preset { display:inline-block; padding:4px 10px; margin:0 6px 6px 0; border-radius:7px; background:#1b2b4a; color:#9ec5ff; font-size:12px; cursor:pointer; border:0; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">Vix<span>Image</span></div>
    <div class="nav">
      <a href="/">概览</a>
      <a href="/mymodels">我的模型</a>
      <a href="/upstream">上游模型</a>
      <a href="/playground" class="on">Playground</a>
      <a href="/config">系统配置</a>
    </div>
    <div class="right"><button onclick="logout()">退出</button></div>
  </div>
  <div class="wrap">
    <div class="box">
      <h3>直接试玩上游生图</h3>
      <label>图片模型</label><select id="model_id"></select>
      <div class="hint" id="engine_desc"></div>
      <label>提示词</label><textarea id="prompt" rows="5" placeholder="描述你想要的画面…"></textarea>
      <div>
        <button class="preset" onclick="quick('电影级科幻海报，巨型机甲剪影，霓虹雨夜，体积光')">科幻机甲</button>
        <button class="preset" onclick="quick('治愈系插画，小猫在窗台晒太阳，暖色调，胶片质感')">治愈小猫</button>
        <button class="preset" onclick="quick('产品摄影，香水瓶特写，纯色背景，柔和布光')">产品图</button>
      </div>
      <div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div><label>尺寸（留空用默认）</label><input id="size" placeholder="1024x1024"></div>
        <div><label>张数</label><input id="n" type="number" value="1" min="1" max="4"></div>
      </div>
      <div class="hint" id="sizes_hint"></div>
      <label>参考图（可选，图生图）</label><input id="ref" type="file" accept="image/*">
      <button class="go" id="goBtn" onclick="run()">生成</button>
      <div class="err" id="err"></div>
    </div>
    <div class="box">
      <h3>生成结果</h3>
      <div class="gallery" id="gallery"><span style="color:#7d93bd;font-size:13px">还没有生成过图片。</span></div>
    </div>
  </div>
<script src="/session.js"></script>
<script>
let models=[];
async function load(){
  const j=await (await fetch('/api/upstream')).json();
  models=(j.upstream||[]).filter(m=>m.type==='image'&&m.enabled);
  document.getElementById('model_id').innerHTML=models.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.model_name)})</option>`).join('')||'<option value="0">（请先在上游模型添加图片模型）</option>';
  syncModel();
}
function syncModel(){
  const m=models.find(x=>String(x.id)===document.getElementById('model_id').value);
  if(!m) return;
  document.getElementById('engine_desc').textContent=m.agent_desc?('引擎介绍：'+m.agent_desc):'（未填写引擎介绍，可在上游模型页配置）';
  document.getElementById('sizes_hint').textContent=m.sizes&&m.sizes.length?('支持尺寸：'+m.sizes.join(' / ')):'';
}
function quick(t){ document.getElementById('prompt').value=t; }
async function run(){
  const btn=document.getElementById('goBtn');
  btn.disabled=true; btn.textContent='生成中…';
  document.getElementById('err').textContent='';
  const fd=new FormData();
  fd.append('model_id',document.getElementById('model_id').value);
  fd.append('prompt',document.getElementById('prompt').value);
  fd.append('size',document.getElementById('size').value);
  fd.append('n',document.getElementById('n').value||'1');
  const rf=document.getElementById('ref').files[0];
  if(rf) fd.append('ref',rf);
  const r=await fetch('/api/playground',{method:'POST',body:fd});
  const j=await r.json().catch(()=>({}));
  btn.disabled=false; btn.textContent='生成';
  if(r.ok&&j.ok){
    const g=document.getElementById('gallery');
    if(g.querySelector('span')) g.innerHTML='';
    for(const u of (j.images||[])){
      const d=document.createElement('div');
      d.innerHTML=`<img src="${u}" loading="lazy"><a href="${u}" target="_blank">${u}</a>`;
      g.prepend(d);
    }
  } else document.getElementById('err').textContent=j.error||'生成失败';
}
document.getElementById('model_id').addEventListener('change',syncModel);
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
async function logout(){ try{ localStorage.removeItem('vix_sid'); }catch(e){} await fetch('/api/logout',{method:'POST'}); location.href='/login'; }
load();
</script>
</body>
</html>
