<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VixImage · 调用概述</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0a0e1a; color:#e8eefc; font-family: system-ui,"Segoe UI",sans-serif; }
  .top { display:flex; align-items:center; padding:14px 22px; background:#101a30; border-bottom:1px solid #243a63; }
  .logo { font-weight:700; font-size:18px; letter-spacing:1px; }
  .logo span { color:#7c3aed; }
  .nav { margin-left:30px; display:flex; gap:6px; }
  .nav a { color:#9ec5ff; text-decoration:none; padding:8px 14px; border-radius:8px; font-size:14px; }
  .nav a:hover, .nav a.on { background:#1b2b4a; color:#fff; }
  .right { margin-left:auto; font-size:13px; color:#7d93bd; }
  .right button { background:#22324f; border:0; color:#cfe0ff; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .wrap { padding:26px; max-width:1200px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:20px; }
  .card { background:#101a30; border:1px solid #243a63; border-radius:12px; padding:14px; text-align:center; }
  .card .n { font-size:24px; font-weight:700; }
  .card .l { color:#7d93bd; font-size:12px; margin-top:4px; }
  table { width:100%; border-collapse:collapse; background:#101a30; border:1px solid #243a63; border-radius:12px; overflow:hidden; font-size:13px; }
  th,td { padding:10px 12px; text-align:left; border-bottom:1px solid #1c2c4a; }
  th { background:#0e1830; color:#9ec5ff; font-weight:600; }
  .tag { padding:2px 8px; border-radius:6px; font-size:12px; }
  .ok { background:#10331f; color:#5ee08a; }
  .fail { background:#3a1414; color:#ff7b7b; }
  .run { background:#332a10; color:#ffd166; }
  .deep { padding:2px 7px; border-radius:6px; background:#3b2a6b; color:#c4b5fd; font-size:11px; }
  .det td { background:#0c1526; color:#9db4da; font-size:12px; line-height:1.7; white-space:pre-wrap; }
  .det b { color:#cbd5f5; }
  .linkbtn { background:none; border:0; color:#9ec5ff; cursor:pointer; font-size:12px; text-decoration:underline; padding:0; }
  .pager { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:13px; color:#9db4da; }
  .pager button { background:#1b2b4a; border:1px solid #2c4470; color:#cfe0ff; padding:6px 12px; border-radius:8px; cursor:pointer; }
  .pager button:disabled { opacity:.4; cursor:not-allowed; }
  .pager select { width:auto; padding:5px 8px; border-radius:7px; border:1px solid #2c4470; background:#0c1426; color:#e8eefc; }
  .trace { margin-top:8px; border-left:2px solid #3b82f6; padding-left:12px; }
  .trace .step { margin:5px 0; }
  .trace .n { color:#7c3aed; font-weight:600; }
  .trace .th { color:#e8eefc; }
  .trace .op { color:#6f86b0; font-size:11px; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">Vix<span>Image</span></div>
    <div class="nav">
      <a href="/">概览</a>
      <a href="/mymodels">我的模型</a>
      <a href="/upstream">上游模型</a>
      <a href="/playground">Playground</a>
      <a href="/config">系统配置</a>
    </div>
    <div class="right"><button onclick="logout()">退出</button></div>
  </div>
  <div class="wrap">
    <h2 style="margin:0 0 16px; font-size:18px;">调用概述</h2>
    <div class="cards" id="cards"></div>
    <table>
      <thead><tr><th>ID</th><th>Agent</th><th>提示词</th><th>状态</th><th>产出</th><th>轮次</th><th>步数</th><th>耗时</th><th>时间</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager">
      <span>共 <b id="total">0</b> 条</span>
      <button id="prev" onclick="go(-1)">上一页</button>
      <span>第 <b id="curPage">1</b> / <b id="pages">1</b> 页</span>
      <button id="next" onclick="go(1)">下一页</button>
      <select id="sizeSel" onchange="changeSize()"><option value="10">10 条/页</option><option value="20" selected>20 条/页</option><option value="50">50 条/页</option></select>
    </div>
  </div>
<script src="/session.js"></script>
<script>
let PAGE=1, SIZE=20, PAGES=1;
async function load(){
  const ov=await (await fetch('/api/overview?page='+PAGE+'&size='+SIZE)).json();
  const s=ov.stats||{};
  const cards=[
    ['总', s.total||0],['成功', s.success||0],['失败', s.failed||0],
    ['进行中', s.running||0],['产出图', s.outputs||0],['累计步数', s.steps_used||0]
  ];
  document.getElementById('cards').innerHTML=cards.map(c=>`<div class="card"><div class="n">${c[1]}</div><div class="l">${c[0]}</div></div>`).join('');
  PAGE=ov.page||1; PAGES=ov.pages||1;
  document.getElementById('total').textContent=ov.total||0;
  document.getElementById('curPage').textContent=PAGE;
  document.getElementById('pages').textContent=Math.max(1,PAGES);
  document.getElementById('prev').disabled=PAGE<=1;
  document.getElementById('next').disabled=PAGE>=PAGES;
  const rows=(ov.logs||[]).map(l=>{
    const cls=(l.status==='success'||l.status==='success_partial')?'ok':(l.status==='failed'?'fail':'run');
    const statusLabel=l.status==='success_partial'?'半成品':l.status;
    let trace=[]; try{ trace=JSON.parse(l.trace||'[]'); }catch(e){}
    const hasDetail=(trace.length||l.reasoning||l.theme||l.error);
    const btn=hasDetail?`<button class="linkbtn" onclick="toggleDet(${l.id})">轨迹</button>`:'';
    const traceHtml=trace.length?`<div class="trace"><b>每步思考与调用操作：</b>`+
      trace.map(t=>`<div class="step"><span class="n">第${t.step}步</span> <span class="th">${esc(t.think||'（无）')}</span> <span class="op">｜ ${esc(t.ops||'')}</span></div>`).join('')+
      `</div>`:'';
    return `<tr><td>${l.id}</td><td><code>${l.agent_call_name}</code></td><td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(l.prompt)}">${esc(l.prompt)}</td>
      <td><span class="tag ${cls}">${statusLabel}</span></td><td>${l.output_images}</td><td>${l.llm_calls||0}</td><td>${l.steps_used||0}</td>
      <td>${l.duration_ms}ms</td><td>${new Date(l.created_at).toLocaleString()}</td><td>${btn}</td></tr>`
      + (hasDetail?`<tr class="det" id="det-${l.id}" style="display:none"><td colspan="10">`
        + (l.theme?`<b>主题：</b>${esc(l.theme)}\n`:'')
        + (l.error?`<b>错误：</b>${esc(l.error)}\n`:'')
        + traceHtml
        + `</td></tr>`:'');
  }).join('');
  document.getElementById('rows').innerHTML=rows||'<tr><td colspan="10" style="color:#7d93bd">暂无调用记录</td></tr>';
}
function go(d){ const n=PAGE+d; if(n<1||n>PAGES) return; PAGE=n; load(); }
function changeSize(){ SIZE=parseInt(document.getElementById('sizeSel').value)||20; PAGE=1; load(); }
function toggleDet(id){ const e=document.getElementById('det-'+id); if(e) e.style.display = (e.style.display==='none'?'table-row':'none'); }
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
async function logout(){ try{ localStorage.removeItem('vix_sid'); }catch(e){} await fetch('/api/logout',{method:'POST'}); location.href='/login'; }
load(); setInterval(load, 10000);
</script>
</body>
</html>
