<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VixImage · 上游模型</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0a0e1a; color:#e8eefc; font-family: system-ui,"Segoe UI",sans-serif; }
  .top { display:flex; align-items:center; padding:14px 22px; background:#101a30; border-bottom:1px solid #243a63; }
  .logo { font-weight:700; font-size:18px; letter-spacing:1px; }
  .logo span { color:#7c3aed; }
  .nav { margin-left:30px; display:flex; gap:6px; }
  .nav a { color:#9ec5ff; text-decoration:none; padding:8px 14px; border-radius:8px; font-size:14px; }
  .nav a:hover, .nav a.on { background:#1b2b4a; color:#fff; }
  .right { margin-left:auto; font-size:13px; color:#7d93bd; }
  .right button { background:#22324f; border:0; color:#cfe0ff; padding:7px 12px; border-radius:8px; cursor:pointer; }
  .wrap { padding:26px; max-width:1200px; margin:0 auto; display:grid; grid-template-columns:380px 1fr; gap:20px; }
  .box { background:#101a30; border:1px solid #243a63; border-radius:14px; padding:18px; }
  h3 { margin:0 0 14px; font-size:15px; color:#9ec5ff; }
  label { display:block; font-size:12px; color:#8fb2e6; margin:10px 0 5px; }
  input,select,textarea { width:100%; padding:9px 11px; border-radius:8px; border:1px solid #2c4470; background:#0c1426; color:#e8eefc; font-size:13px; box-sizing:border-box; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  label.chk { display:inline-block; font-size:13px; color:#cdd9f0; margin-top:12px;
             margin-bottom:0; line-height:1.5; white-space:normal; }
  label.chk input { margin-right:8px; vertical-align:middle; }
  label.chk span { display:inline; }
  button.add { margin-top:16px; width:100%; padding:11px; border:0; border-radius:9px; cursor:pointer; background:linear-gradient(90deg,#3b82f6,#7c3aed); color:#fff; font-weight:600; }
  .err { color:#ff7b7b; font-size:12px; margin-top:8px; min-height:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:9px 10px; text-align:left; border-bottom:1px solid #1c2c4a; }
  th { color:#9ec5ff; }
  .del { background:#3a1414; color:#ff7b7b; border:0; padding:5px 10px; border-radius:6px; cursor:pointer; }
  .pill { padding:2px 8px; border-radius:6px; background:#1b2b4a; font-size:12px; }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">Vix<span>Image</span></div>
    <div class="nav">
      <a href="/">概览</a>
      <a href="/mymodels">我的模型</a>
      <a href="/upstream" class="on">上游模型</a>
      <a href="/playground">Playground</a>
      <a href="/config">系统配置</a>
    </div>
    <div class="right"><button onclick="logout()">退出</button></div>
  </div>
  <div class="wrap">
    <div class="box">
      <h3>添加上游模型</h3>
      <label>名称</label><input id="name">
      <label>类型</label>
      <select id="type"><option value="image">图片模型</option><option value="llm">大模型(LLM)</option></select>
      <label>API 格式</label>
      <select id="format">
        <option value="openai">OpenAI 兼容 (images/generations)</option>
        <option value="agnes">Agnes 兼容 (v1/images/generations)</option>
        <option value="openai_chat">OpenAI 兼容 Chat (chat/completions)</option>
      </select>
      <label>Base URL</label><input id="base_url" placeholder="https://api.example.com">
      <label>API Key</label><input id="api_key" type="password">
      <label>模型名 (model_name)</label><input id="model_name" placeholder="agnes-image-2.5-flash">
      <div class="row2">
        <div><label>默认尺寸</label><input id="size" placeholder="1024x1024"></div>
        <div><label>数量 n</label><input id="n" type="number" value="1"></div>
      </div>
      <label>支持的多尺寸（逗号分隔，如 1024x1024,1280x720,720x1280）</label><input id="sizes" placeholder="留空则不限制尺寸">
      <label>对 Agent 的介绍（Agent 据此对症选择引擎，如「擅长赛博朋克人像、夜景色调」）</label>
      <textarea id="agent_desc" rows="2" placeholder="可选，写给规划器看的引擎特长说明"></textarea>
      <label>最大输出 Token（LLM，小上下文模型务必设置）</label><input id="max_tokens" type="number" value="2400" placeholder="2400">
      <div class="hint" style="font-size:11px;color:#6f86b0;margin-top:4px;">LLM 单次回复的 max_tokens 上限；图片模型可忽略。0 或留空用内置缺省 2400。</div>
      <label class="chk"><input type="checkbox" id="multimodal" checked><span>多模态(视觉) —— 大模型必须勾选</span></label>
      <br>
      <label class="chk"><input type="checkbox" id="enabled" checked><span>启用</span></label>
      <button class="add" onclick="add()">添加模型</button>
      <div class="err" id="err"></div>
    </div>
    <div class="box">
      <h3>已配置上游模型</h3>
      <table>
        <thead><tr><th>ID</th><th>名称</th><th>类型</th><th>格式</th><th>模型名</th><th>尺寸</th><th>maxTok</th><th>多模态</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
<script src="/session.js"></script>
<script>
async function add(){
  const body={
    name:name_.value, type:type_.value, format:format_.value, base_url:base_url.value,
    api_key:api_key.value, model_name:model_name.value, size:size.value,
    sizes:sizes_.value.split(',').map(s=>s.trim()).filter(Boolean),
    agent_desc:agent_desc.value,
    max_tokens:parseInt(max_tokens.value||'0'),
    n:parseInt(n_.value||'1'), multimodal:multimodal.checked, enabled:enabled.checked
  };
  const r=await fetch('/api/upstream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){ err_.textContent=''; load(); }
  else err_.textContent=j.error||'添加失败';
}
async function del(id){ await fetch('/api/upstream/'+id,{method:'DELETE'}); load(); }
async function load(){
  const j=await (await fetch('/api/upstream')).json();
  document.getElementById('rows').innerHTML=(j.upstream||[]).map(m=>
    `<tr><td>${m.id}</td><td>${esc(m.name)}</td><td><span class="pill">${m.type}</span></td><td>${m.format}</td><td><code>${esc(m.model_name)}</code></td><td>${(m.sizes||[]).map(s=>`<span class="pill">${s}</span>`).join('')||m.size||''}</td><td>${m.max_tokens||'—'}</td><td>${m.multimodal?'是':'否'}</td><td><button class="del" onclick="del(${m.id})">删除</button></td></tr>`
  ).join('')||'<tr><td colspan="9" style="color:#7d93bd">暂无</td></tr>';
}
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
const name_=document.getElementById('name'); const type_=document.getElementById('type');
const format_=document.getElementById('format'); const base_url=document.getElementById('base_url');
const api_key=document.getElementById('api_key'); const model_name=document.getElementById('model_name');
const size=document.getElementById('size'); const n_=document.getElementById('n');
const sizes_=document.getElementById('sizes'); const agent_desc=document.getElementById('agent_desc');
const max_tokens=document.getElementById('max_tokens');
const multimodal=document.getElementById('multimodal'); const enabled=document.getElementById('enabled');
const err_=document.getElementById('err');
async function logout(){ try{ localStorage.removeItem('vix_sid'); }catch(e){} await fetch('/api/logout',{method:'POST'}); location.href='/login'; }
load();
</script>
</body>
</html>
